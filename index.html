<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="style.css">
  </head>
<body>
  <div class="card">
  <h2>Password Strength Check</h2>
  <input type="text" id="usernameInput" placeholder="username">
  <input type="text" id="pwInput" placeholder="type a password">
  <br>
  <button onclick="checkPassword()">Check</button>
  <p id="result"></p>
  </div>

  <script>
    async function checkPassword() {
      const username = document.getElementById("usernameInput").value || "guest";
      const password = document.getElementById("pwInput").value;

    const response = await fetch("https://password-length-checker-api.onrender.com/check-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: username, password: password })
    });

    const data = await response.json();

    if (data.reused) {
        document.getElementById("result").innerHTML = `<strong>${data.message}</strong>`;
        return;
      }
    
    let output = `<strong>${data.label}</strong> (${data.score}/100)<br>`;
    output += "<ul>";
    for (const detail of data.details) {
      output += `<li>${detail}</li>`;
    }
    output += "</ul>";

    if (data.suggestion) {
      output += `Suggestion: <strong>${data.suggestion}</strong>`;
    }

    document.getElementById("result").innerHTML = output;
  }
  </script>
</body>
</html>
