<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="style.css">
  </head>
<body>
  <div class="card">
  <h2>Password Strength Check</h2>
  <input type="text" id="pwInput" placeholder="type a password">
  <br>
  <button onclick="checkPassword()">Check</button>
  <p id="result"></p>
  </div>

  <p id="result"></p>

  <script>
    async function checkPassword() {
      const password = document.getElementById("pwInput").value;

      const response = await fetch("https://password-length-checker-api.onrender.com/check-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: password })
      });

      const data = await response.json();
      document.getElementById("result").innerText =
        "Password length: " + data.password_length;
    }
  </script>
</body>
</html>
